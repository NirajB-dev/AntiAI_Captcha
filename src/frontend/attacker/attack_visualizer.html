<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attack Visualizer - Motor CAPTCHA</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        body {
            font-family: "Inter", system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 35%, #0b1324 100%);
            color: #e2e8f0;
            min-height: 100vh;
        }
        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .pill {
            padding: 6px 12px;
            border-radius: 999px;
            background: #1e293b;
            color: #cbd5e1;
            font-size: 12px;
            letter-spacing: 0.5px;
            border: 1px solid #334155;
        }
        .card {
            background: #0b1221;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        }
        .grid {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 16px;
        }
        .controls label {
            display: block;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 6px;
        }
        .controls select,
        .controls input[type="range"],
        .controls input[type="number"] {
            width: 100%;
            background: #0f172a;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 8px 10px;
            margin-bottom: 12px;
        }
        .controls input[type="range"] {
            padding: 4px 0;
        }
        .controls .row {
            display: flex;
            gap: 12px;
        }
        .controls .row > div {
            flex: 1;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(120deg, #22c55e, #16a34a);
            color: #0b1221;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn:active {
            transform: translateY(1px);
            box-shadow: none;
        }
        #attackCanvas {
            width: 100%;
            border-radius: 14px;
            background: #0f172a;
            border: 1px solid #1f2937;
        }
        .log {
            margin-top: 14px;
            padding: 12px;
            border-radius: 12px;
            background: #0f172a;
            border: 1px solid #1f2937;
            font-family: "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 13px;
            color: #cbd5e1;
            max-height: 220px;
            overflow: auto;
            white-space: pre-wrap;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }
        .badge.pass { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.4); }
        .badge.fail { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.4); }
        .status-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <div>
                <div class="pill">Attacker Emulator</div>
                <h1 style="margin: 6px 0 0; color: #f8fafc;">Motor CAPTCHA Attack Visualizer</h1>
                <p style="margin: 4px 0 0; color: #94a3b8;">Generate bot-like mouse streams, visualize paths, and send them through the live verifier.</p>
            </div>
            <div class="pill" id="securityLevel">Security: Loading...</div>
        </div>

        <div class="grid">
            <div class="card controls">
                <label for="strategy">Attack pattern</label>
                <select id="strategy">
                    <option value="linear">Linear (constant speed)</option>
                    <option value="curve">Curved with light jitter</option>
                    <option value="noisy">Velocity mimic with pauses</option>
                </select>

                <div class="row">
                    <div>
                        <label for="targets">Targets</label>
                        <input id="targets" type="number" min="3" max="12" value="6">
                    </div>
                    <div>
                        <label for="steps">Steps per leg</label>
                        <input id="steps" type="number" min="5" max="60" value="22">
                    </div>
                </div>

                <label for="jitter">Jitter / noise</label>
                <input id="jitter" type="range" min="0" max="18" value="6">

                <label for="baseDelay">Base delay (ms)</label>
                <input id="baseDelay" type="range" min="5" max="60" value="18">

                <div class="row" style="align-items:center; margin-bottom:12px;">
                    <input type="checkbox" id="useAdvanced" style="width:auto; margin:0;">
                    <label for="useAdvanced" style="margin:0;">Include advanced model scoring</label>
                </div>

                <button class="btn" id="runAttack">Run attack + visualize</button>
                <div class="status-line">
                    <span id="attackStatus">Idle</span>
                    <span id="powStatus">PoW: -</span>
                </div>
            </div>

            <div class="card">
                <canvas id="attackCanvas" width="820" height="480"></canvas>
                <div class="status-line">
                    <span id="verdictBadge" class="badge fail">Waiting</span>
                    <span id="scoreLine">Score: -</span>
                </div>
                <div class="log" id="attackLog">Ready.</div>
            </div>
        </div>
    </div>

    <script src="/pow.js"></script>
    <script src="/fingerprint.js"></script>
    <script src="/attacker/attack_visualizer.js"></script>
</body>
</html>
